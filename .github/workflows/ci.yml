name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (vet / fmt / tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deeptrols
          POSTGRES_PASSWORD: deeptrols_dev
          POSTGRES_DB: deeptrols_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deeptrols"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://deeptrols:deeptrols_dev@localhost:5432/deeptrols_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://deeptrols:deeptrols_dev@localhost:5432/deeptrols_test?sslmode=disable
      JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: ci@deeptrols.test
      ADMIN_PASSWORD: ci-test-admin-password
      ENABLE_FAKE_PAYMENT: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: gofmt check (whole repo)
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './web/node_modules/*' -not -path './node_modules/*'))
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Run tests (per-package isolated schemas, parallel)
        run: go test ./... -count=1

  frontend:
    name: Frontend (tsc / lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint
